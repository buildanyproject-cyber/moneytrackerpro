name: moneytrackerpro_anti
description: "MoneyTracker Pro - Advanced Income & Expense Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Charts
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Biometric Auth
  local_auth: ^2.3.0

  # File Handling
  path_provider: ^2.1.5

  # Google Sign In & Drive
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.3.0

  # Export
  pdf: ^3.11.3
  csv: ^6.0.0
  excel: ^4.0.6

  # Image Picker (receipts)
  image_picker: ^1.1.2

  # UUID
  uuid: ^4.5.1

  # Intl (date formatting)
  intl: ^0.20.2

  # Share
  share_plus: ^10.1.4

  # Permission handler
  permission_handler: ^11.4.0

  # Open file
  open_file: ^3.5.10
  url_launcher: ^6.3.2
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.12.0
  flutter_localizations:
    sdk: flutter
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: any
  build_runner: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
